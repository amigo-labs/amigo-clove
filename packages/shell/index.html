<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>amigo-clove</title>
    <meta
      name="description"
      content="Browser-Port der Arcade-Shooter DOVE und DoveZ von Markus Madeja — ein Launcher, zwei Spiele, offline spielbar."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <!-- Nur eigene Quellen; Pixi erzeugt Shader-Code zur Laufzeit (unsafe-eval), libopenmpt läuft als WebAssembly. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' data: blob:; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #ccc;
        font:
          16px system-ui,
          sans-serif;
      }
      #screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .scanlines {
        position: absolute;
        left: var(--game-x);
        top: var(--game-y);
        width: var(--game-w);
        height: var(--game-h);
        background: linear-gradient(to bottom, transparent 50%, rgb(0 0 0 / 0.35) 50%);
        background-size: 100% calc(var(--px) * 1px);
      }
      .overlay .fullscreen {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        padding: 0.2rem 0.5rem;
        font-size: 1.25rem;
        line-height: 1;
        border-color: #666;
        background: rgb(0 0 0 / 0.6);
        color: #ccc;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: auto;
      }
      .overlay .fullscreen[data-visible],
      .overlay .fullscreen:focus-visible {
        opacity: 1;
      }
      .touch-keys {
        position: absolute;
        inset: auto 0 0 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0.75rem;
        pointer-events: none;
      }
      .touch-pad {
        display: grid;
        grid-template-areas: ". up ." "left . right" ". down .";
        gap: 0.25rem;
      }
      .touch-actions {
        display: flex;
        gap: 0.75rem;
      }
      .touch-key {
        width: 3.25rem;
        height: 3.25rem;
        padding: 0;
        border-radius: 50%;
        border-color: rgb(255 204 102 / 0.5);
        background: rgb(0 0 0 / 0.45);
        font-size: 1.1rem;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .touch-key:active {
        background: rgb(255 204 102 / 0.35);
      }
      .touch-key.up {
        grid-area: up;
      }
      .touch-key.left {
        grid-area: left;
      }
      .touch-key.right {
        grid-area: right;
      }
      .touch-key.down {
        grid-area: down;
      }
      [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .hud {
        position: absolute;
        inset: 0;
        font:
          600 14px/1.2 system-ui,
          sans-serif;
        color: #eee;
        text-shadow: 0 1px 2px #000;
        --hud-side: min(15rem, calc(var(--game-x) - 1.5rem));
      }
      .hud-value {
        font-variant-numeric: tabular-nums;
        color: #fc6;
        font-size: 1.35em;
      }
      .hud-score,
      .hud-lives {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
      }
      .hud-score span,
      .hud-lives span,
      .hud-meter span,
      .hud-boss span {
        font-size: 0.75em;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #aaa;
      }
      .hud-player {
        display: grid;
        gap: 0.35rem;
      }
      .hud-meters {
        display: grid;
        gap: 0.3rem;
      }
      .hud-meter {
        display: grid;
        grid-template-columns: 4.5rem 1fr;
        align-items: center;
        gap: 0.4rem;
      }
      .hud-meter b,
      .hud-boss b {
        display: block;
        height: 0.6rem;
        border: 1px solid rgb(255 255 255 / 0.35);
        border-radius: 3px;
        background: rgb(0 0 0 / 0.5);
        overflow: hidden;
      }
      .hud-meter i,
      .hud-boss i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--meter, #fc6);
        transition: width 80ms linear;
      }
      .hud-meter[data-id="energy"] {
        --meter: linear-gradient(90deg, #3c3, #9f6);
      }
      .hud-meter[data-id="beam"] {
        --meter: linear-gradient(90deg, #a00, #f55);
      }
      .hud-meter[data-id="beam"][data-variant="1"] {
        --meter: linear-gradient(90deg, #06c, #6cf);
      }
      .hud-meter[data-id="shield"] {
        --meter: linear-gradient(90deg, #099, #6ff);
      }
      .hud-meter[data-id="speed"] {
        --meter: linear-gradient(90deg, #960, #fc6);
      }
      .hud-meter[data-id="power"] {
        --meter: linear-gradient(90deg, #c60, #fa3);
      }
      .hud-meter[data-full] i {
        animation: hud-blink 0.14s steps(2) infinite;
      }
      @keyframes hud-blink {
        50% {
          filter: brightness(1.8);
        }
      }
      .hud-icons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        align-items: center;
      }
      .hud-icon {
        display: inline-flex;
        gap: 2px;
        align-items: center;
      }
      .hud-icon[data-dim] {
        opacity: 0.35;
      }
      .hud-icon[data-selected] {
        outline: 2px solid #fc6;
        outline-offset: 1px;
        border-radius: 2px;
      }
      .hud-sprite {
        display: inline-block;
        background-repeat: no-repeat;
        image-rendering: pixelated;
      }
      .hud-glyph {
        color: #fc6;
        font-size: 1.1em;
      }
      .hud-combo {
        color: #fc6;
      }
      .hud-boss {
        position: absolute;
        left: calc(var(--game-x) + var(--game-w) * 0.2);
        width: calc(var(--game-w) * 0.6);
        top: calc(var(--game-y) + 0.5rem);
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 0.5rem;
      }
      .hud-boss b {
        height: 0.75rem;
      }
      .hud-boss i {
        background: linear-gradient(90deg, #a00, #f63);
      }
      /* neben dem Spielfeld: Spieler 1 links, Spieler 2 rechts, Leben unten links */
      .hud[data-layout="side"] .hud-player {
        position: absolute;
        top: calc(var(--game-y) + 1rem);
        width: var(--hud-side);
      }
      .hud[data-layout="side"] .hud-player[data-player="0"] {
        left: calc(var(--game-x) - var(--hud-side) - 0.75rem);
      }
      .hud[data-layout="side"] .hud-player[data-player="1"] {
        left: calc(var(--game-x) + var(--game-w) + 0.75rem);
      }
      .hud[data-layout="side"] .hud-lives,
      .hud[data-layout="side"] .hud-combo {
        position: absolute;
        left: calc(var(--game-x) - var(--hud-side) - 0.75rem);
        width: var(--hud-side);
      }
      .hud[data-layout="side"] .hud-lives {
        top: calc(var(--game-y) + var(--game-h) - 2.5rem);
      }
      .hud[data-layout="side"] .hud-combo {
        top: calc(var(--game-y) + var(--game-h) - 4.5rem);
      }
      /* darunter bzw. als Leiste im Spielfeld */
      .hud[data-layout="below"] .hud-bar,
      .hud[data-layout="inside"] .hud-bar {
        position: absolute;
        left: var(--game-x);
        width: var(--game-w);
        box-sizing: border-box;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem 1.25rem;
        padding: 0.35rem 0.75rem;
      }
      .hud[data-layout="below"] .hud-bar {
        top: calc(var(--game-y) + var(--game-h) + 0.25rem);
      }
      /* im Spielfeld oben: unten liegen Funkbild und Laufband (DoveZ) */
      .hud[data-layout="inside"] .hud-bar {
        top: var(--game-y);
        background: linear-gradient(rgb(0 0 0 / 0.6), transparent);
        font-size: 12px;
      }
      .hud[data-layout="inside"] .hud-boss {
        top: calc(var(--game-y) + 3.25rem);
      }
      .hud[data-layout="below"] .hud-player,
      .hud[data-layout="inside"] .hud-player {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem 1rem;
      }
      .hud[data-layout="below"] .hud-meters,
      .hud[data-layout="inside"] .hud-meters {
        grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr));
        min-width: 12rem;
        flex: 1;
      }
      .hud[data-layout="below"] .hud-meter,
      .hud[data-layout="inside"] .hud-meter {
        grid-template-columns: auto 1fr;
      }
      /* Tastenübersicht: in der Pause neben bzw. über dem Spielbild, im Launcher aufklappbar */
      .controls-overlay {
        position: absolute;
        box-sizing: border-box;
        width: max-content;
        max-height: calc(var(--game-h) - 1rem);
        overflow: hidden;
        padding: 0.6em 0.8em;
        border: 1px solid rgb(255 204 102 / 0.4);
        border-radius: 6px;
        background: rgb(0 0 0 / 0.82);
        font:
          clamp(10px, calc(var(--game-w) / 80), 14px) / 1.3 system-ui,
          sans-serif;
        color: #ddd;
      }
      .controls-overlay[data-layout="side"] {
        left: calc(var(--game-x) + var(--game-w) + 0.75rem);
        top: calc(var(--game-y) + 0.5rem);
        max-width: calc(100% - var(--game-x) - var(--game-w) - 1.5rem);
        font-size: 13px;
      }
      .controls-overlay[data-layout="inside"] {
        left: calc(var(--game-x) + var(--game-w) / 2);
        max-width: calc(var(--game-w) - 1rem);
        transform: translateX(-50%);
      }
      /* oben unter der HUD-Leiste, unten bleiben die unteren 12 % (Pausemenü) frei */
      .controls-overlay[data-layout="inside"][data-at="top"] {
        top: calc(var(--game-y) + 2.5rem);
        max-height: calc(var(--game-h) * 0.88 - 3rem);
      }
      /* unten; das obere Viertel (Pausemenü) bleibt frei */
      .controls-overlay[data-layout="inside"][data-at="bottom"] {
        bottom: calc(100% - var(--game-y) - var(--game-h) + 0.5rem);
        max-height: calc(var(--game-h) * 0.75 - 1rem);
      }
      .controls-overlay[data-layout="inside"][data-at="center"] {
        top: calc(var(--game-y) + var(--game-h) / 2);
        transform: translate(-50%, -50%);
      }
      .controls-overlay h2 {
        margin: 0 0 0.4rem;
      }
      .controls-sheet {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em 1.5em;
        align-items: flex-start;
      }
      .controls-sheet table {
        border-collapse: collapse;
      }
      .controls-sheet caption {
        text-align: left;
        color: #fc6;
        padding-bottom: 0.2rem;
      }
      .controls-sheet th,
      .controls-sheet td {
        padding: 0.1em 0.7em 0.1em 0;
        text-align: left;
        vertical-align: top;
        white-space: nowrap;
      }
      .controls-sheet thead th {
        font-size: 0.75em;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #999;
        font-weight: 600;
      }
      .controls-sheet tbody th {
        font-weight: normal;
        color: #eee;
      }
      .controls-sheet kbd {
        display: inline-block;
        min-width: 1.1em;
        padding: 0 0.3em;
        border: 1px solid #666;
        border-bottom-width: 2px;
        border-radius: 3px;
        background: #1a1a1a;
        color: #fc6;
        font: inherit;
        text-align: center;
      }
      .game .controls {
        grid-column: 1 / span 2;
        font-size: 0.85rem;
      }
      .game .controls summary {
        cursor: pointer;
        color: #ccc;
      }
      .game .controls .controls-sheet {
        margin-top: 0.5rem;
        overflow-x: auto;
      }
      /* HTML-Bildschirme der Spiele (Menüs, Pause, Continue …) über bzw. statt des Canvas */
      .stage[data-ui="page"] canvas {
        visibility: hidden;
      }
      .stage[data-ui] .hud,
      .stage[data-ui] .touch-keys {
        display: none;
      }
      .ui-root:empty {
        display: none;
      }
      .ui-screen {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        box-sizing: border-box;
        pointer-events: auto;
        background:
          radial-gradient(ellipse at 50% 30%, rgb(255 204 102 / 0.08), transparent 60%), #050505;
      }
      .stage[data-ui="over"] .ui-screen {
        background: rgb(0 0 0 / 0.55);
      }
      .ui-panel {
        box-sizing: border-box;
        width: min(60rem, 100%);
        max-height: 100%;
        overflow: auto;
        padding: 1.25rem 1.5rem;
        border: 1px solid rgb(255 204 102 / 0.35);
        border-radius: 8px;
        background: rgb(12 10 6 / 0.92);
        box-shadow: 0 0.5rem 2rem rgb(0 0 0 / 0.6);
      }
      .ui-screen[data-kind="confirm"] .ui-panel,
      .ui-screen[data-kind="input"] .ui-panel,
      .ui-screen[data-kind="notice"] .ui-panel {
        width: min(34rem, 100%);
        text-align: center;
      }
      .ui-title {
        margin: 0 0 1rem;
        font-size: 1.5rem;
      }
      .ui-body.split {
        display: grid;
        grid-template-columns: minmax(12rem, 18rem) minmax(0, 1fr);
        gap: 1.5rem;
        align-items: start;
      }
      .ui-aside {
        min-width: 0;
        overflow-x: auto;
      }
      @media (max-width: 40rem) {
        .ui-body.split {
          grid-template-columns: 1fr;
        }
      }
      .ui-logo {
        margin-bottom: 1rem;
      }
      .ui-image {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
        image-rendering: pixelated;
      }
      .ui-sprite {
        background-repeat: no-repeat;
      }
      .ui-items {
        display: grid;
        gap: 0.4rem;
      }
      .ui-items[data-grid] {
        grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      }
      .ui-items[data-row] {
        grid-auto-flow: column;
        justify-content: center;
        margin-top: 1rem;
      }
      .ui-item,
      .ui-field {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        width: 100%;
        box-sizing: border-box;
        padding: 0.55rem 0.9rem;
        border: 1px solid #3a3020;
        border-radius: 4px;
        background: rgb(255 255 255 / 0.03);
        color: #eee;
        text-align: left;
        font: inherit;
      }
      .ui-items[data-grid] .ui-item {
        padding: 0.35rem 0.5rem;
        font-size: 0.85rem;
      }
      .ui-item:hover,
      .ui-field:hover {
        border-color: #866a33;
      }
      .ui-panel:focus,
      .ui-video-box:focus {
        outline: none;
      }
      .ui-item:focus,
      .ui-field:focus,
      .ui-text:focus {
        outline: none;
        border-color: #fc6;
        background: #221a08;
        color: #fc6;
        box-shadow: 0 0 0 1px #fc6;
      }
      .ui-item:disabled {
        opacity: 0.4;
      }
      .ui-hint,
      .ui-info {
        color: #999;
        font-size: 0.85rem;
      }
      .ui-value {
        color: #fc6;
        white-space: nowrap;
        display: inline-flex;
        gap: 0.5rem;
        align-items: center;
      }
      .ui-value meter {
        width: 6rem;
      }
      .ui-field[data-capture] {
        border-color: #fc6;
        animation: hud-blink 0.5s steps(2) infinite;
      }
      .ui-fields {
        display: grid;
        gap: 0.4rem;
      }
      .ui-group {
        margin: 0.75rem 0 0.25rem;
      }
      .ui-input {
        flex-direction: column;
        align-items: stretch;
        gap: 0.35rem;
      }
      .ui-text {
        font: inherit;
        font-size: 1.25rem;
        padding: 0.4rem 0.6rem;
        border: 1px solid #666;
        border-radius: 4px;
        background: #000;
        color: #fff;
      }
      .ui-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-top: 1rem;
      }
      .ui-actions .ui-item {
        width: auto;
      }
      .ui-blocks {
        display: grid;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .ui-lines p {
        margin: 0.15rem 0;
      }
      .ui-lines[data-align="center"] {
        text-align: center;
      }
      .ui-lines[data-tone="accent"] {
        color: #fc6;
      }
      .ui-lines[data-tone="dim"] {
        color: #999;
      }
      .ui-lines.mono p {
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        white-space: pre-wrap;
      }
      .ui-table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      .ui-table caption {
        text-align: left;
        color: #fc6;
        padding-bottom: 0.3rem;
      }
      .ui-table th {
        text-align: left;
        color: #999;
        font-size: 0.75em;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .ui-table td {
        padding: 0.15rem 0.5rem 0.15rem 0;
      }
      .ui-table td:last-child {
        text-align: right;
      }
      .ui-table tr[data-highlight] td {
        color: #fc6;
      }
      .ui-preview {
        margin-top: 1rem;
      }
      .ui-figure {
        margin: 0.5rem 0;
      }
      .ui-scroll {
        max-height: min(60vh, 32rem);
        overflow-y: auto;
        outline: none;
      }
      .ui-panel[data-auto] .ui-scroll {
        overflow: hidden;
        mask-image: linear-gradient(transparent, #000 10%, #000 90%, transparent);
      }
      .ui-countdown {
        font-size: 3rem;
        color: #fc6;
        font-variant-numeric: tabular-nums;
      }
      .ui-progress {
        width: 100%;
        margin-top: 1rem;
      }
      .ui-prompt {
        color: #fc6;
        animation: hud-blink 1s steps(2) infinite;
      }
      .ui-video-box {
        position: absolute;
        inset: 0;
        background: #000;
        outline: none;
      }
      .ui-video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .ui-video-loading {
        position: absolute;
        inset: auto 0 1rem;
        text-align: center;
        color: #999;
      }
      .ui-screen[data-kind="video"] {
        padding: 0;
      }
      #launcher,
      #settings,
      #loading {
        padding: 2rem;
        max-width: 40rem;
        max-height: 100%;
        box-sizing: border-box;
        overflow-y: auto;
      }
      h1 {
        color: #fc6;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      h2 {
        font-size: 1rem;
        color: #fc6;
        margin: 1.5rem 0 0.5rem;
      }
      .games {
        list-style: none;
        padding: 0;
        margin: 0 0 1.5rem;
        display: grid;
        gap: 1rem;
      }
      .game {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.25rem 1rem;
        align-items: center;
        padding: 1rem;
        border: 1px solid #333;
        border-radius: 6px;
      }
      .game .title {
        font-size: 1.5rem;
        color: #fff;
      }
      .game .sub,
      .game .status,
      .hint {
        font-size: 0.85rem;
        color: #999;
      }
      .game .button {
        grid-row: 1 / span 2;
        grid-column: 2;
      }
      .game.unavailable .title,
      .game.unavailable .sub,
      .game.unavailable span.button {
        opacity: 0.5;
      }
      .game .debug {
        grid-column: 1 / span 2;
        font-size: 0.8rem;
        color: #999;
      }
      .game .status[data-offline="ready"] {
        color: #8c8;
      }
      .button,
      button,
      select {
        display: inline-block;
        padding: 0.4rem 1rem;
        border: 1px solid #fc6;
        border-radius: 4px;
        background: #221a08;
        color: #fc6;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      .button.secondary {
        border-color: #666;
        background: none;
        color: #ccc;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin: 0.4rem 0;
