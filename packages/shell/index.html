<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>amigo-clove</title>
    <meta
      name="description"
      content="Browser-Port der Arcade-Shooter DOVE und DoveZ von Markus Madeja — ein Launcher, zwei Spiele, offline spielbar."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <!-- Nur eigene Quellen; Pixi erzeugt Shader-Code zur Laufzeit (unsafe-eval), libopenmpt läuft als WebAssembly. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' data: blob:; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #ccc;
        font:
          16px system-ui,
          sans-serif;
      }
      #screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .scanlines {
        position: absolute;
        left: var(--game-x);
        top: var(--game-y);
        width: var(--game-w);
        height: var(--game-h);
        background: linear-gradient(to bottom, transparent 50%, rgb(0 0 0 / 0.35) 50%);
        background-size: 100% calc(var(--px) * 1px);
      }
      .overlay .fullscreen {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        padding: 0.2rem 0.5rem;
        font-size: 1.25rem;
        line-height: 1;
        border-color: #666;
        background: rgb(0 0 0 / 0.6);
        color: #ccc;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: auto;
      }
      .overlay .fullscreen[data-visible],
      .overlay .fullscreen:focus-visible {
        opacity: 1;
      }
      #launcher,
      #settings,
      #loading {
        padding: 2rem;
        max-width: 40rem;
        max-height: 100%;
        box-sizing: border-box;
        overflow-y: auto;
      }
      h1 {
        color: #fc6;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      h2 {
        font-size: 1rem;
        color: #fc6;
        margin: 1.5rem 0 0.5rem;
      }
      .games {
        list-style: none;
        padding: 0;
        margin: 0 0 1.5rem;
        display: grid;
        gap: 1rem;
      }
      .game {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.25rem 1rem;
        align-items: center;
        padding: 1rem;
        border: 1px solid #333;
        border-radius: 6px;
      }
      .game .title {
        font-size: 1.5rem;
        color: #fff;
      }
      .game .sub,
      .game .status,
      .hint {
        font-size: 0.85rem;
        color: #999;
      }
      .game .button {
        grid-row: 1 / span 2;
        grid-column: 2;
      }
      .game.unavailable .title,
      .game.unavailable .sub,
      .game.unavailable span.button {
        opacity: 0.5;
      }
      .game .debug {
        grid-column: 1 / span 2;
        font-size: 0.8rem;
        color: #999;
      }
      .game .status[data-offline="ready"] {
        color: #8c8;
      }
      .button,
      button,
      select {
        display: inline-block;
        padding: 0.4rem 1rem;
        border: 1px solid #fc6;
        border-radius: 4px;
        background: #221a08;
        color: #fc6;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      .button.secondary {
        border-color: #666;
        background: none;
        color: #ccc;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin: 0.4rem 0;
      }
      .row > span:first-child {
        min-width: 5rem;
      }
      input[type="range"] {
        width: 12rem;
        accent-color: #fc6;
      }
      progress {
        width: 100%;
        accent-color: #fc6;
      }
      #error {
        position: fixed;
        bottom: 1rem;
        left: 1rem;
        color: #f66;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main id="screen"></main>
    <div id="error" role="alert"></div>
    <noscript>
      <p style="padding: 2rem">amigo-clove braucht JavaScript. / amigo-clove needs JavaScript.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
