<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>amigo-clove</title>
    <meta
      name="description"
      content="Browser-Port der Arcade-Shooter DOVE und DoveZ von Markus Madeja — ein Launcher, zwei Spiele, offline spielbar."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <!-- Nur eigene Quellen; Pixi erzeugt Shader-Code zur Laufzeit (unsafe-eval), libopenmpt läuft als WebAssembly. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' data: blob:; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      /*
       * Designsystem: ein Satz Bausteine für Launcher, Einstellungen und die
       * Bildschirme beider Spiele; Farben nur über diese Tokens. Jedes Spiel setzt
       * seinen Akzent (`data-game`), die abgeleiteten Töne folgen ihm.
       */
      :root {
        --accent: #fc6;
        --accent-ink: #221a08;
        --surface: rgb(12 10 6 / 0.92);
        --screen: #050505;
        --text: #eee;
        --text-soft: #ccc;
        --text-dim: #999;
        --warn: #f97;
        --ok: #8c8;
        --radius: 8px;
        --radius-s: 4px;
        --panel-w: 60rem;
        --panel-narrow: 34rem;
      }
      [data-game="dovez"] {
        --accent: #c9db8f;
        --accent-ink: #171d0c;
        --surface: rgb(8 11 6 / 0.92);
      }
      :root,
      [data-game] {
        --accent-line: color-mix(in srgb, var(--accent) 35%, transparent);
        --accent-glow: color-mix(in srgb, var(--accent) 8%, transparent);
        --line: color-mix(in srgb, var(--accent) 20%, #111);
        --line-hover: color-mix(in srgb, var(--accent) 55%, #111);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: var(--text-soft);
        font:
          16px system-ui,
          sans-serif;
      }
      #screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .scanlines {
        position: absolute;
        left: var(--game-x);
        top: var(--game-y);
        width: var(--game-w);
        height: var(--game-h);
        background: linear-gradient(to bottom, transparent 50%, rgb(0 0 0 / 0.35) 50%);
        background-size: 100% calc(var(--px) * 1px);
      }
      .overlay .fullscreen {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        padding: 0.2rem 0.5rem;
        font-size: 1.25rem;
        line-height: 1;
        border-color: #666;
        background: rgb(0 0 0 / 0.6);
        color: var(--text-soft);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: auto;
      }
      .overlay .fullscreen[data-visible],
      .overlay .fullscreen:focus-visible {
        opacity: 1;
      }
      .touch-keys {
        position: absolute;
        inset: auto 0 0 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0.75rem;
        pointer-events: none;
      }
      .touch-pad {
        display: grid;
        grid-template-areas: ". up ." "left . right" ". down .";
        gap: 0.25rem;
      }
      .touch-actions {
        display: flex;
        gap: 0.75rem;
      }
      .touch-key {
        width: 3.25rem;
        height: 3.25rem;
        padding: 0;
        border-radius: 50%;
        border-color: var(--accent-line);
        background: rgb(0 0 0 / 0.45);
        color: var(--accent);
        font-size: 1.1rem;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .touch-key:active {
        background: var(--accent-line);
      }
      .touch-key.up {
        grid-area: up;
      }
      .touch-key.left {
        grid-area: left;
      }
      .touch-key.right {
        grid-area: right;
      }
      .touch-key.down {
        grid-area: down;
      }
      [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .hud {
        position: absolute;
        inset: 0;
        font:
          600 14px/1.2 system-ui,
          sans-serif;
        color: var(--text);
        text-shadow: 0 1px 2px #000;
        --hud-side: min(15rem, calc(var(--game-x) - 1.5rem));
      }
      .hud-value {
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        font-size: 1.35em;
      }
      .hud-score,
      .hud-lives {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
      }
      .hud-score span,
      .hud-lives span,
      .hud-meter span,
      .hud-boss span {
        font-size: 0.75em;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-dim);
      }
      .hud-player {
        display: grid;
        gap: 0.35rem;
      }
      .hud-meters {
        display: grid;
        gap: 0.3rem;
      }
      .hud-meter {
        display: grid;
        grid-template-columns: 4.5rem 1fr;
        align-items: center;
        gap: 0.4rem;
      }
      .hud-meter b,
      .hud-boss b {
        display: block;
        height: 0.6rem;
        border: 1px solid rgb(255 255 255 / 0.35);
        border-radius: 3px;
        background: rgb(0 0 0 / 0.5);
        overflow: hidden;
      }
      .hud-meter i,
      .hud-boss i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--meter, var(--accent));
        transition: width 80ms linear;
      }
      .hud-meter[data-id="energy"] {
        --meter: linear-gradient(90deg, #3c3, #9f6);
      }
      .hud-meter[data-id="beam"] {
        --meter: linear-gradient(90deg, #a00, #f55);
      }
      .hud-meter[data-id="beam"][data-variant="1"] {
        --meter: linear-gradient(90deg, #06c, #6cf);
      }
      .hud-meter[data-id="shield"] {
        --meter: linear-gradient(90deg, #099, #6ff);
      }
      .hud-meter[data-id="speed"] {
        --meter: linear-gradient(90deg, #960, #fc6);
      }
      .hud-meter[data-id="power"] {
        --meter: linear-gradient(90deg, #c60, #fa3);
      }
      .hud-meter[data-full] i {
        animation: hud-blink 0.14s steps(2) infinite;
      }
      @keyframes hud-blink {
        50% {
          filter: brightness(1.8);
        }
      }
      .hud-icons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        align-items: center;
      }
      .hud-icon {
        display: inline-flex;
        gap: 2px;
        align-items: center;
      }
      .hud-icon[data-dim] {
        opacity: 0.35;
      }
      .hud-icon[data-selected] {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        border-radius: 2px;
      }
      .hud-sprite {
        display: inline-block;
        background-repeat: no-repeat;
        image-rendering: pixelated;
      }
      .hud-glyph {
        color: var(--accent);
        font-size: 1.1em;
      }
      .hud-combo {
        color: var(--accent);
      }
      .hud-boss {
        position: absolute;
        left: calc(var(--game-x) + var(--game-w) * 0.2);
        width: calc(var(--game-w) * 0.6);
        top: calc(var(--game-y) + 0.5rem);
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 0.5rem;
      }
      .hud-boss b {
        height: 0.75rem;
      }
      .hud-boss i {
        background: linear-gradient(90deg, #a00, #f63);
      }
      /* neben dem Spielfeld: Spieler 1 links, Spieler 2 rechts, Leben unten links */
      .hud[data-layout="side"] .hud-player {
        position: absolute;
        top: calc(var(--game-y) + 1rem);
        width: var(--hud-side);
      }
      .hud[data-layout="side"] .hud-player[data-player="0"] {
        left: calc(var(--game-x) - var(--hud-side) - 0.75rem);
      }
      .hud[data-layout="side"] .hud-player[data-player="1"] {
        left: calc(var(--game-x) + var(--game-w) + 0.75rem);
      }
      .hud[data-layout="side"] .hud-lives,
      .hud[data-layout="side"] .hud-combo {
        position: absolute;
        left: calc(var(--game-x) - var(--hud-side) - 0.75rem);
        width: var(--hud-side);
      }
      .hud[data-layout="side"] .hud-lives {
        top: calc(var(--game-y) + var(--game-h) - 2.5rem);
      }
      .hud[data-layout="side"] .hud-combo {
        top: calc(var(--game-y) + var(--game-h) - 4.5rem);
      }
      /* darunter bzw. als Leiste im Spielfeld */
      .hud[data-layout="below"] .hud-bar,
      .hud[data-layout="inside"] .hud-bar {
        position: absolute;
        left: var(--game-x);
        width: var(--game-w);
        box-sizing: border-box;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem 1.25rem;
        padding: 0.35rem 0.75rem;
      }
      .hud[data-layout="below"] .hud-bar {
        top: calc(var(--game-y) + var(--game-h) + 0.25rem);
      }
      /* im Spielfeld oben: unten liegen Funkbild und Laufband (DoveZ) */
      .hud[data-layout="inside"] .hud-bar {
        top: var(--game-y);
        background: linear-gradient(rgb(0 0 0 / 0.6), transparent);
        font-size: 12px;
      }
      .hud[data-layout="inside"] .hud-boss {
        top: calc(var(--game-y) + 3.25rem);
      }
      .hud[data-layout="below"] .hud-player,
      .hud[data-layout="inside"] .hud-player {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem 1rem;
      }
      .hud[data-layout="below"] .hud-meters,
      .hud[data-layout="inside"] .hud-meters {
        grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr));
        min-width: 12rem;
        flex: 1;
      }
      .hud[data-layout="below"] .hud-meter,
      .hud[data-layout="inside"] .hud-meter {
        grid-template-columns: auto 1fr;
      }
      /* Grundbausteine */
      button {
        font: inherit;
        color: inherit;
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        background: none;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      kbd {
        display: inline-flex;
        align-items: center;
        gap: 0.2em;
        min-width: 1.1em;
        padding: 0 0.35em;
        border: 1px solid #555;
        border-bottom-width: 2px;
        border-radius: 3px;
        background: #161616;
        color: var(--accent);
        font: inherit;
        line-height: 1.4;
        justify-content: center;
      }
      progress,
      meter {
        accent-color: var(--accent);
      }
      /* Tastenübersicht (Pause, Launcher) */
      .controls-sheet {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75em 1.5em;
        align-items: flex-start;
      }
      .controls-sheet table,
      .ui-table {
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      .ui-table {
        width: 100%;
      }
      .controls-sheet caption,
      .ui-table caption {
        text-align: left;
        color: var(--accent);
        padding-bottom: 0.3rem;
        font-weight: 600;
      }
      .controls-sheet th,
      .controls-sheet td,
      .ui-table td {
        padding: 0.15em 0.7em 0.15em 0;
        text-align: left;
        vertical-align: top;
      }
      .controls-sheet th,
      .controls-sheet td {
        white-space: nowrap;
      }
      .controls-sheet thead th,
      .ui-table th {
        text-align: left;
        font-size: 0.75em;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-dim);
        font-weight: 600;
      }
      .controls-sheet tbody th {
        font-weight: normal;
        color: var(--text);
      }
      .ui-table td:last-child {
        text-align: right;
      }
      .ui-table tr[data-highlight] td {
        color: var(--accent);
      }
      /* HTML-Bildschirme: Seiten der Shell und Bildschirme der Spiele über bzw. statt des Canvas */
      .page {
        position: absolute;
        inset: 0;
      }
      .stage[data-ui="page"] canvas {
        visibility: hidden;
      }
      .stage[data-ui] .hud,
      .stage[data-ui] .touch-keys {
        display: none;
      }
      .ui-root:empty {
        display: none;
      }
      .ui-screen {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        box-sizing: border-box;
        pointer-events: auto;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 30%, var(--accent-glow), transparent 60%), var(--screen);
      }
      [data-ui="over"] .ui-screen {
        background: rgb(0 0 0 / 0.55);
      }
      .ui-panel {
        box-sizing: border-box;
        width: min(var(--panel-w), 100%);
        max-height: 100%;
        overflow: auto;
        padding: 1.25rem 1.5rem;
        border: 1px solid var(--accent-line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 0.5rem 2rem rgb(0 0 0 / 0.6);
      }
      .ui-screen[data-kind="confirm"] .ui-panel,
      .ui-screen[data-kind="input"] .ui-panel,
      .ui-screen[data-kind="notice"] .ui-panel {
        width: min(var(--panel-narrow), 100%);
        text-align: center;
      }
      /* schlichte Menüs (ohne zweite Spalte und Raster) schmal */
      .ui-screen[data-kind="menu"] .ui-panel:not(:has(.ui-body.split, .ui-items[data-grid])) {
        width: min(36rem, 100%);
      }
      .ui-panel:focus,
      .ui-video-box:focus {
        outline: none;
      }
      /* Kopf: Marke des Spiels, Titel in Versalien, zweite Zeile */
      .ui-brand {
        display: flex;
        justify-content: center;
        margin: -0.25rem 0 0.75rem;
      }
      .ui-brand .ui-brand-logo {
        width: auto;
        max-width: min(12rem, 60%);
        max-height: 4rem;
        margin: 0;
      }
      .ui-brand-name {
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      .ui-head {
        margin: 0 0 1rem;
        padding-bottom: 0.6rem;
        border-bottom: 1px solid var(--line);
      }
      .ui-title {
        margin: 0;
        color: var(--accent);
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .ui-subtitle {
        margin: 0.25rem 0 0;
        color: var(--text-dim);
      }
      .ui-body.split {
        display: grid;
        grid-template-columns: minmax(12rem, 20rem) minmax(0, 1fr);
        gap: 1.5rem;
        align-items: start;
      }
      .ui-aside {
        min-width: 0;
        overflow-x: auto;
      }
      @media (max-width: 40rem) {
        .ui-body.split {
          grid-template-columns: 1fr;
        }
      }
      .ui-logo {
        margin-bottom: 1rem;
      }
      /* beide Hauptmenüs: das Logo gleich breit */
      .ui-logo .ui-image {
        max-width: min(20rem, 100%);
      }
      .ui-image {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
        image-rendering: pixelated;
      }
      .ui-sprite {
        background-repeat: no-repeat;
      }
      /* Einträge und Felder: in Ruhe gedämpft, gewählt im Akzent */
      .ui-items {
        display: grid;
        gap: 0.4rem;
      }
      .ui-items[data-grid] {
        grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      }
      .ui-items[data-row] {
        grid-auto-flow: column;
        justify-content: center;
        margin-top: 1rem;
      }
      .ui-item,
      .ui-field {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        width: 100%;
        box-sizing: border-box;
        padding: 0.55rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        background: rgb(255 255 255 / 0.03);
        color: var(--text);
        text-align: left;
        font: inherit;
        cursor: pointer;
      }
      .ui-items[data-grid] .ui-item {
        padding: 0.35rem 0.5rem;
        font-size: 0.85rem;
      }
      .ui-item:hover,
      .ui-field:hover {
        border-color: var(--line-hover);
      }
      .ui-item:focus,
      .ui-field:focus,
      .ui-text:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--accent-ink);
        color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .ui-item:disabled {
        opacity: 0.4;
        cursor: default;
      }
      /* Spielkarten im Launcher: groß, Untertitel darunter */
      .ui-item[data-game] {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.2rem;
        padding-block: 0.75rem;
      }
      .ui-item[data-game] .ui-label {
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .ui-aside .controls-sheet {
        font-size: 0.85rem;
      }
      .ui-item .ui-icon {
        flex: none;
        width: 6rem;
      }
      .ui-item .ui-label {
        flex: 1;
      }
      .ui-hint,
      .ui-info {
        color: var(--text-dim);
        font-size: 0.85rem;
      }
      .ui-item:focus .ui-hint {
        color: inherit;
        opacity: 0.8;
      }
      .ui-info[data-tone="dim"] {
        margin: 0 0 0.25rem;
      }
      .ui-info[data-tone="warn"] {
        color: var(--warn);
      }
      .ui-hinted > .ui-hint {
        margin: 0.25rem 0.9rem 0.25rem;
      }
      .ui-value {
        color: var(--accent);
        white-space: nowrap;
        display: inline-flex;
        gap: 0.5rem;
        align-items: center;
      }
      .ui-arrow {
        opacity: 0.6;
        font-size: 0.8em;
      }
      .ui-value meter {
        width: 6rem;
      }
      .ui-range-text {
        min-width: 3.5em;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      /* Tastenfeld: belegte Tasten als Kappen, ✕ entfernt eine, ＋ nimmt eine auf */
      .ui-keys {
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.35rem;
      }
      .ui-key-remove {
        border: none;
        padding: 0 0 0 0.15em;
        color: var(--text-dim);
        font-size: 0.75em;
        line-height: 1;
      }
      .ui-key-remove:hover {
        color: var(--warn);
      }
      .ui-key-add,
      .ui-key-empty {
        color: var(--text-dim);
      }
      /* Tastenfelder zweispaltig, Überschriften und Vorlage über die ganze Breite */
      .ui-fields:has(.ui-key) {
        grid-template-columns: repeat(auto-fill, minmax(min(22rem, 100%), 1fr));
      }
      .ui-fields:has(.ui-key) > :not(.ui-key) {
        grid-column: 1 / -1;
      }
      .ui-key {
        padding-block: 0.35rem;
        align-items: center;
      }
      .ui-field[data-warn] {
        border-color: var(--warn);
      }
      .ui-field[data-capture] {
        border-color: var(--accent);
        animation: hud-blink 0.5s steps(2) infinite;
      }
      .ui-field[data-capture] .ui-key-add {
        color: var(--accent);
      }
      .ui-fields {
        display: grid;
        gap: 0.4rem;
      }
      .ui-group {
        margin: 0.75rem 0 0.15rem;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .ui-input {
        flex-direction: column;
        align-items: stretch;
        gap: 0.35rem;
        cursor: default;
      }
      .ui-text {
        font: inherit;
        font-size: 1.25rem;
        padding: 0.4rem 0.6rem;
        border: 1px solid #666;
        border-radius: var(--radius-s);
        background: #000;
        color: #fff;
      }
      .ui-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-top: 1rem;
      }
      .ui-actions .ui-item {
        width: auto;
      }
      .ui-blocks {
        display: grid;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .ui-lines h2 {
        margin: 0.75rem 0 0.2rem;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }
