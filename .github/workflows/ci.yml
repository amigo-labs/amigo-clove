name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 24.04 fest: ffmpeg/libopus (6.1.1-3ubuntu5) sind Teil des Asset-Cache-Schlüssels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run test
      - run: bun run assets:check

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # gepinnte playwright-core-Version aus packages/shell (passende Chromium-Revision)
      - run: bun run --cwd packages/shell browsers
      - run: bun run smoke
