name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run test
      # Assets werden lokal einmal gebaut und committet; CI konvertiert nichts, sondern
      # prüft nur Hashes (Dateien ↔ Manifest ↔ Quellen/Optionen).
      - run: bun run assets:verify

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # gepinnte playwright-core-Version aus packages/shell (passende Chromium-Revision)
      - run: bun run --cwd packages/shell browsers
      - run: bun run smoke
